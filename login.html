<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login / Register - TransAsia</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="auth-container">
        <div class="auth-box">

            <div class="auth-left">
                <div class="overlay-auth"></div>
                <div class="auth-content">
                    <a href="index.html" class="logo-white"><i class="fas fa-globe-americas"></i> TransAsia</a>
                    <h2>Start Your <br>Global Journey</h2>
                    <p>Join 10,000+ professionals who found their dream careers abroad with us.</p>
                </div>
            </div>

            <div class="auth-right">

                <form id="loginForm" class="auth-form active-form">
                    <h2>Welcome Back!</h2>
                    <p class="auth-subtitle">Login to access your dashboard.</p>

                    <div class="input-wrap">
                        <input type="email" class="input-field" required>
                        <label>Email Address</label>
                        <i class="fas fa-envelope"></i>
                    </div>

                    <div class="input-wrap">
                        <input type="password" class="input-field" id="loginPass" required>
                        <label>Password</label>
                        <i class="fas fa-eye-slash toggle-pass" onclick="togglePassword('loginPass', this)"></i>
                    </div>

                    <div class="form-options">
                        <label class="remember-me">
                            <input type="checkbox"> Remember me
                        </label>
                        <a href="#" class="forgot-pass">Forgot Password?</a>
                    </div>

                    <button type="submit" class="btn-primary w-100">Sign In</button>

                    <div class="divider"><span>OR</span></div>

                    <div class="social-login">
                        <button type="button" class="google-btn"><i class="fab fa-google"></i> Google</button>
                        <button type="button" class="fb-btn"><i class="fab fa-facebook-f"></i> Facebook</button>
                    </div>

                    <p class="bottom-text">
                        Don't have an account? <a href="#" id="showRegister">Register Now</a>
                    </p>
                </form>

                <form id="registerForm" class="auth-form">
                    <h2>Create Account</h2>
                    <p class="auth-subtitle">Get started for free.</p>

                    <div class="input-wrap">
                        <input type="text" class="input-field" required>
                        <label>Full Name</label>
                        <i class="fas fa-user"></i>
                    </div>

                    <div class="input-wrap">
                        <input type="email" class="input-field" required>
                        <label>Email Address</label>
                        <i class="fas fa-envelope"></i>
                    </div>

                    <div class="input-wrap">
                        <input type="password" class="input-field" id="regPass" required>
                        <label>Password</label>
                        <i class="fas fa-eye-slash toggle-pass" onclick="togglePassword('regPass', this)"></i>
                    </div>

                    <button type="submit" class="btn-primary w-100">Create Account</button>

                    <p class="bottom-text">
                        Already have an account? <a href="#" id="showLogin">Sign In</a>
                    </p>
                </form>

            </div>
        </div>
    </div>

    <script src="auth-script.js"></script>
</body>

</html>
